<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Title Prefixer 설정</title>
  <link rel="stylesheet" href="../common/theme.css">
  <link rel="stylesheet" href="options.css">
  <script src="../common/theme.js"></script>
</head>
<body>
  <div class="main">
    <header>
      <h1>Title Prefixer <span class="version" id="version"></span></h1>
      <div class="header-actions">
        <select id="theme" title="테마">
          <option value="system">테마: 시스템</option>
          <option value="light">테마: 라이트</option>
          <option value="dark">테마: 다크</option>
        </select>
        <button id="export-btn">내보내기</button>
        <button id="import-btn">가져오기</button>
        <input type="file" id="import-file" accept="application/json,.json" class="hidden">
      </div>
    </header>

    <div class="panel">
      <div class="section">
        <h2>기본 동작</h2>
        <div class="row">
          <label for="enabled">사용</label>
          <label class="switch"><input type="checkbox" id="enabled"> <span id="enabled-text"></span></label>
        </div>
        <div class="row">
          <label for="prefix">프리픽스</label>
          <input type="text" id="prefix" class="grow" placeholder="예: 회사 - ">
        </div>
        <div class="row">
          <label for="append-date">날짜·시각</label>
          <label class="switch"><input type="checkbox" id="append-date"> 제목 뒤에 열람 시각 붙이기</label>
        </div>
        <div class="row">
          <label>미리보기</label>
          <code class="preview" id="prefix-preview"></code>
        </div>
        <p class="hint">URL 규칙에 맞지 않고 제외 키워드도 없는 모든 http(s) 탭에 적용됩니다.</p>
      </div>

      <div class="section">
        <h2>
          <span>URL 규칙 <span class="count" id="rule-count"></span></span>
          <button class="small primary" id="add-rule">+ 규칙 추가</button>
        </h2>
        <p class="hint">URL 이 맞으면 탭 제목을 지정한 값으로 <b>통째로 바꿉니다</b>. 위에 있는 규칙이 먼저 적용되니 더 구체적인 URL 을 위로 올리세요 (⠿ 를 끌어서 순서 변경).</p>
        <div class="row tester">
          <input type="text" id="test-url" class="grow" placeholder="URL 을 넣어 어떤 규칙이 적용되는지 확인">
          <span id="test-result" class="hint"></span>
        </div>
        <table>
          <thead>
            <tr>
              <th class="grip"></th>
              <th class="col-on">사용</th>
              <th class="col-match">방식</th>
              <th>URL 패턴</th>
              <th class="col-title">탭 제목</th>
              <th class="actions"></th>
            </tr>
          </thead>
          <tbody id="rule-body"></tbody>
        </table>
        <p class="empty hidden" id="rule-empty">규칙이 없습니다.</p>
      </div>

      <div class="section">
        <h2>제외 키워드</h2>
        <p class="hint">원래 제목에 아래 글자가 들어 있으면 프리픽스를 붙이지 않습니다. (URL 규칙에는 영향 없음)</p>
        <div id="keyword-list" class="chips"></div>
        <div class="row">
          <input type="text" id="keyword-input" placeholder="키워드 입력 후 Enter">
          <button id="keyword-add">추가</button>
        </div>
      </div>

      <div class="section">
        <h2>초기화</h2>
        <div class="row">
          <button class="danger" id="reset-btn">기본값으로 되돌리기</button>
          <span class="hint">처음 설치했을 때의 규칙·키워드로 되돌립니다.</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="../common/config.js"></script>
  <script src="options.js"></script>
</body>
</html>
